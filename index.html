  <style>
    /* Reset & Base Styles */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050e21;
      color: #ffffff;
      touch-action: manipulation;
    }

    /* Full-Screen Deep Blue Background */
    body {
      background: radial-gradient(circle at 50% 15%, rgba(22, 60, 138, 0.82) 0%, rgba(10, 25, 54, 0.95) 60%, rgba(4, 11, 26, 1) 100%);
      background-color: #050e21;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }

    /* Decorative Background Mesh Glows */
    .bg-glow-1 {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(29, 90, 212, 0.45) 0%, rgba(13, 27, 62, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: fixed;
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 52, 130, 0.35) 0%, rgba(5, 14, 33, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* App Container */
    #app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)) 16px;
      z-index: 1;
      position: relative;
    }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #050e21;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-wrap {
      position: relative;
      width: auto;
      height: auto;
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo-wrap img {
      width: 150px;
      height: 150px;
      max-width: 170px;
      max-height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 35px rgba(22, 80, 210, 0.8));
      animation: pulse-glow 2s infinite ease-in-out;
      display: block;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 20px rgba(22, 80, 210, 0.5)); transform: scale(1); }
      50% { filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 35px rgba(45, 120, 255, 0.85)); transform: scale(1.03); }
    }

    .splash-title {
      margin-top: 24px;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .splash-sub {
      margin-top: 6px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .splash-loader {
      margin-top: 32px;
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #1d61e8, #60a5fa);
      animation: load-bar 1.2s infinite ease-in-out;
      transform-origin: left;
    }

    @keyframes load-bar {
      0% { transform: scaleX(0); }
      50% { transform: scaleX(0.7); }
      100% { transform: scaleX(1); }
    }

    /* Top Title Header */
    header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
      margin-bottom: 22px;
      text-align: center;
    }

    .header-logo-badge {
      width: auto;
      height: auto;
      background: transparent;
      border: none;
      padding: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, filter 0.25s ease;
      cursor: pointer;
    }

    .header-logo-badge:active {
      transform: scale(0.96);
    }

    .header-logo-badge:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .header-logo-badge img {
      width: 130px;
      height: 130px;
      max-width: 150px;
      max-height: 150px;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 22px rgba(16, 68, 194, 0.45));
      display: block;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      line-height: 1.1;
    }

    .header-subtitle {
      font-size: 0.8rem;
      font-weight: 600;
      color: #93c5fd;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0.9;
    }

    /* PWA Install Button */
    .pwa-install-btn {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 14px;
      background: rgba(29, 97, 232, 0.4);
      border: 1px solid rgba(147, 197, 253, 0.4);
      border-radius: 20px;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .pwa-install-btn:active {
      background: rgba(29, 97, 232, 0.7);
      transform: scale(0.96);
    }

    /* Main View Area */
    .view-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Sub-Grid Top Nav Bar */
    .subgrid-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      backdrop-filter: blur(12px);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-btn:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    .subgrid-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Clean 3x3 Grid Layout */
    .grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin: 0 auto;
    }

    /* Grid Button Card */
    .grid-card {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 6px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .grid-card:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .grid-card:active {
      transform: scale(0.93);
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Stacked Clean White Icon */
    .grid-icon {
      width: 32px;
      height: 32px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      flex-shrink: 0;
    }

    .grid-icon svg {
      width: 100%;
      height: 100%;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Stacked Clean White Text Label */
    .grid-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.2;
      word-break: break-word;
      hyphens: auto;
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    /* Subgrid Badge Indicator */
    .subgrid-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 6px #60a5fa;
    }

    /* Text Below Grid */
    .motto-section {
      margin-top: 24px;
      text-align: center;
      padding: 0 8px;
    }

    .motto-primary {
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
      line-height: 1.45;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      margin-bottom: 6px;
    }

    .motto-secondary {
      font-size: 0.8rem;
      font-weight: 500;
      color: #93c5fd;
      line-height: 1.4;
    }

    .motto-secondary a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .motto-secondary a:hover {
      color: #60a5fa;
    }

    /* Toast Notification Overlay */
    .toast {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(10, 25, 54, 0.95);
      border: 1px solid rgba(147, 197, 253, 0.4);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      z-index: 9000;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Animation Transitions */
    .fade-enter {
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding-top: 20px;
      padding-bottom: 8px;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.5px;
    }

    /* Larger Screen Adjustments */
    @media (min-width: 480px) {
      .grid-3x3 {
        gap: 16px;
      }
      .grid-card {
        padding: 14px 8px;
        border-radius: 20px;
      }
      .grid-icon {
        width: 36px;
        height: 36px;
        margin-bottom: 10px;
      }
      .grid-label {
        font-size: 0.85rem;
      }
      .motto-primary {
        font-size: 0.92rem;
      }
      .motto-secondary {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

    // Current State Variable
    let currentView = "main";

    // DOM Element References
    const viewArea = document.getElementById("view-area");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toast-msg");
    const splashScreen = document.getElementById("splash-screen");
    const logoHeaderBtn = document.getElementById("logo-header-btn");

    // Toast Feedback
    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    // Link Handler
    function openLink(title, url) {
      showToast(`Opening ${title}...`);
      setTimeout(() => {
        if (url.startsWith("tel:")) {
          window.location.href = url;
        } else {
          window.open(url, "_blank", "noopener,noreferrer");
        }
      }, 200);
    }

    // Render Main 3x3 Grid
    function renderMainGrid() {
      currentView = "main";
      let html = `<div class="grid-3x3 fade-enter">`;

      DATA_CONFIG.mainGrid.forEach(item => {
        html += `
          <button class="grid-card" data-id="${item.id}">
            ${item.hasSubgrid ? '<div class="subgrid-badge"></div>' : ''}
            <div class="grid-icon">${item.icon}</div>
            <div class="grid-label">${item.title}</div>
          </button>
        `;
      });

      html += `</div>`;
      viewArea.innerHTML = html;

      // Click Listeners
      viewArea.querySelectorAll(".grid-card").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          const item = DATA_CONFIG.mainGrid.find(i => i.id === id);
          if (!item) return;

          if (item.hasSubgrid) {
            renderSubgrid(item);
          } else if (item.url) {
            openLink(item.title, item.url);
          }
        });
      });
    }

    // Render Subgrid Layout
    function renderSubgrid(parentItem) {
      currentView = parentItem.id;
      let html = `
        <div class="fade-enter" style="width: 100%;">
          <div class="subgrid-nav">
            <button id="back-to-main" class="back-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
              <span>Back</span>
            </button>
            <div class="subgrid-title">${parentItem.title}</div>
            <div style="width: 50px;"></div>
          </div>
          <div class="grid-3x3">
      `;

      parentItem.items.forEach((sub, idx) => {
        html += `
          <button class="grid-card subgrid-card" data-idx="${idx}">
            <div class="grid-icon">${sub.icon}</div>
            <div class="grid-label">${sub.title}</div>
          </button>
        `;
      });

      html += `
          </div>
        </div>
      `;

      viewArea.innerHTML = html;

      // Back Button Listener
      document.getElementById("back-to-main").addEventListener("click", () => {
        renderMainGrid();
      });

      // Subgrid Item Listener
      viewArea.querySelectorAll(".subgrid-card").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-idx"), 10);
          const sub = parentItem.items[idx];
          if (sub && sub.url) {
            openLink(sub.title, sub.url);
          }
        });
      });
    }

    // Logo Click returns to main grid
    logoHeaderBtn.addEventListener("click", () => {
      if (currentView !== "main") {
        renderMainGrid();
      }
    });

    // Hide Splash Screen
    window.addEventListener("load", () => {
      setTimeout(() => {
        splashScreen.classList.add("hidden");
        renderMainGrid();
      }, 600);
    });

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('Ravenna Portal SW registered');
        }).catch(err => {
          console.log('SW registration error:', err);
        });
      });
    }

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById("pwa-install-btn");

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-flex";
    });

    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBtn.style.display = "none";
          }
          deferredPrompt = null;
        });
      }
    });
